<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FARMS — Viewport Lab &amp; Multi-Platform Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dev-preview.css?v=1.0.4">
</head>
<body>

  <div class="studio-layout">

    <!-- ── 1. Top Control Bar ── -->
    <header class="studio-header">
      
      <!-- Studio Brand -->
      <div class="studio-brand">
        <div class="studio-logo-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <div class="studio-title-group">
          <h1>FARMS <span class="badge">VIEWPORT LAB</span></h1>
        </div>
      </div>

      <!-- Controls Center -->
      <div class="studio-controls-center">

        <!-- Target Page Selector -->
        <select class="studio-select" id="pageSelect" title="Select FARMS system page to preview">
          <option value="dashboard.html">Admin Dashboard</option>
          <option value="faculty.html">Faculty Portal</option>
          <option value="login.html">Login Portal</option>
          <option value="student.html">Student Room Finder</option>
          <option value="svg-preview.html">CAD Blueprints Viewer</option>
        </select>

        <!-- Category Buttons -->
        <div class="studio-control-group">
          <button type="button" class="studio-btn active" data-cat="phone" title="Mobile Phones">📱 Phone</button>
          <button type="button" class="studio-btn" data-cat="tablet" title="Tablets &amp; iPads">📟 Tablet</button>
          <button type="button" class="studio-btn" data-cat="laptop" title="Laptops &amp; Notebooks">💻 Laptop</button>
          <button type="button" class="studio-btn" data-cat="desktop" title="Desktop &amp; Ultrawide Monitors">🖥️ Desktop</button>
        </div>

        <!-- Device Presets Dropdown -->
        <select class="studio-select" id="devicePresetSelect" title="Select device resolution preset">
          <optgroup label="Mobile Phones (9:16 - 20:9)">
            <option value="iphone-15-pro" selected>iPhone 15 Pro (393 × 852 · 19.5:9)</option>
            <option value="iphone-se">iPhone SE / 8 (375 × 667 · 9:16)</option>
            <option value="pixel-8">Google Pixel 8 (412 × 915 · 20:9)</option>
            <option value="galaxy-s24">Samsung Galaxy S24 (412 × 920 · 20:9)</option>
            <option value="compact-phone">Compact Phone (360 × 740 · 18.5:9)</option>
          </optgroup>
          <optgroup label="Tablets &amp; Foldables (4:3 - 16:10)">
            <option value="ipad-mini">iPad Mini (768 × 1024 · 3:4)</option>
            <option value="ipad-air-port">iPad Air Portrait (820 × 1180 · 4:3)</option>
            <option value="ipad-air-land">iPad Air Landscape (1180 × 820 · 16:11)</option>
            <option value="ipad-pro-12">iPad Pro 12.9" (1024 × 1366 · 3:4)</option>
            <option value="surface-pro">Surface Pro 9 (912 × 1368 · 2:3)</option>
          </optgroup>
          <optgroup label="Laptops &amp; MacBooks (16:10 - 16:9)">
            <option value="macbook-air">MacBook Air 13" (1280 × 800 · 16:10)</option>
            <option value="laptop-1366">Standard Laptop (1366 × 768 · 16:9)</option>
            <option value="laptop-1440">High-Res Laptop (1440 × 900 · 16:10)</option>
          </optgroup>
          <optgroup label="Monitors &amp; Desktops (16:9 - 21:9)">
            <option value="desktop-1080">FHD Desktop (1920 × 1080 · 16:9)</option>
            <option value="desktop-2k">WQHD 2K (2560 × 1440 · 16:9)</option>
            <option value="ultrawide">21:9 Ultrawide (2560 × 1080 · 21:9)</option>
          </optgroup>
          <option value="custom">Custom Dimensions...</option>
        </select>

        <!-- Aspect Ratio Selector -->
        <select class="studio-select" id="aspectRatioSelect" title="Select or Lock Aspect Ratio">
          <option value="auto">Aspect: Auto / Free</option>
          <optgroup label="Landscape Ratios">
            <option value="16:9">16:9 — Standard Widescreen</option>
            <option value="16:10">16:10 — Mac / Laptop</option>
            <option value="21:9">21:9 — Ultrawide Monitor</option>
            <option value="4:3">4:3 — Tablet / Classic</option>
            <option value="3:2">3:2 — Surface / Camera</option>
          </optgroup>
          <optgroup label="Portrait Ratios">
            <option value="9:16">9:16 — Standard Mobile</option>
            <option value="9:19.5">9:19.5 — iPhone (X–15)</option>
            <option value="9:20">9:20 — Android Tall (S24/Pixel)</option>
            <option value="3:4">3:4 — iPad Portrait</option>
            <option value="2:3">2:3 — Surface Portrait</option>
          </optgroup>
          <optgroup label="Square">
            <option value="1:1">1:1 — Square Box</option>
          </optgroup>
        </select>

        <!-- Separate X and Y Dimension Controls -->
        <div class="axis-cluster">
          <!-- X Axis (Width) -->
          <div class="axis-field" id="fieldAxisX" title="Width (X) — Click &amp; Drag label to scrub, or enter px">
            <span class="axis-label scrubbable" id="labelScrubX" title="Drag horizontally to scrub Width (X)">X</span>
            <input type="number" id="customW" class="dim-input" value="393" min="280" max="4000" title="Width (X) in px">
          </div>

          <!-- Link/Unlink Proportional Lock Toggle -->
          <button type="button" class="btn-axis-link" id="btnLinkRatio" title="Toggle Aspect Lock: Separate X &amp; Y vs Linked Dimensions">
            <svg class="icon-unlinked" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
              <line x1="2" y1="2" x2="22" y2="22" stroke-width="2"/>
            </svg>
            <svg class="icon-linked" style="display:none;" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
          </button>

          <!-- Y Axis (Height) -->
          <div class="axis-field" id="fieldAxisY" title="Height (Y) — Click &amp; Drag label to scrub, or enter px">
            <span class="axis-label scrubbable" id="labelScrubY" title="Drag horizontally to scrub Height (Y)">Y</span>
            <input type="number" id="customH" class="dim-input" value="852" min="280" max="4000" title="Height (Y) in px">
          </div>
        </div>

        <!-- Rotate Orientation -->
        <button type="button" class="btn-icon-action" id="btnRotateOrientation" title="Rotate Orientation (Portrait ↔ Landscape)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l6.73-1.19"/>
          </svg>
        </button>

        <!-- Hardware Frame / Bezel Toggle -->
        <button type="button" class="btn-icon-action active" id="btnToggleBezel" title="Toggle Hardware Frame / Bezels">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>
          </svg>
        </button>

      </div>

      <!-- Controls Right -->
      <div class="studio-controls-right">
        <!-- Zoom Selector -->
        <select class="studio-select" id="zoomSelect" title="Display Scaling Mode">
          <option value="fit" selected>Fit Window</option>
          <option value="1">100% (1:1)</option>
          <option value="0.85">85%</option>
          <option value="0.75">75%</option>
          <option value="0.5">50%</option>
          <option value="custom" disabled>Custom Zoom</option>
        </select>

        <!-- Reload Iframe -->
        <button type="button" class="btn-icon-action" id="btnReloadIframe" title="Reload Frame Content">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>

        <!-- Open External -->
        <button type="button" class="btn-icon-action" id="btnOpenExternal" title="Open Page in New Tab">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </button>
      </div>

    </header>

    <!-- ── 2. Viewport Simulator Stage ── -->
    <main class="studio-canvas-stage" id="canvasStage">
      <div class="viewport-scale-wrapper" id="scaleWrapper">
        <div class="device-container frame-phone" id="deviceContainer">
          <iframe src="dashboard.html" class="simulator-iframe" id="simulatorIframe" title="FARMS System Simulation"></iframe>
          <div class="device-dim-tag" id="deviceDimTag">393 × 852 px</div>

          <!-- Drag Resize Handles -->
          <div class="resize-handle handle-n" data-handle="n" title="Drag to adjust height (Top edge)">
            <div class="handle-bar-h"></div>
          </div>
          <div class="resize-handle handle-s" data-handle="s" title="Drag to adjust height (Bottom edge)">
            <div class="handle-bar-h"></div>
          </div>
          <div class="resize-handle handle-w" data-handle="w" title="Drag to adjust width (Left edge)">
            <div class="handle-bar-v"></div>
          </div>
          <div class="resize-handle handle-e" data-handle="e" title="Drag to adjust width (Right edge)">
            <div class="handle-bar-v"></div>
          </div>
          <div class="resize-handle handle-nw" data-handle="nw" title="Drag to adjust dimensions (Top-Left corner)"></div>
          <div class="resize-handle handle-ne" data-handle="ne" title="Drag to adjust dimensions (Top-Right corner)"></div>
          <div class="resize-handle handle-sw" data-handle="sw" title="Drag to adjust dimensions (Bottom-Left corner)"></div>
          <div class="resize-handle handle-se" data-handle="se" title="Drag to adjust dimensions (Bottom-Right corner)">
            <div class="handle-corner-grip"></div>
          </div>

          <!-- Live Dragging Floating Dimension Badge -->
          <div class="resize-badge" id="resizeBadge">393 × 852 px</div>
        </div>
      </div>
    </main>

    <!-- ── 3. Bottom Telemetry & Breakpoint Bar ── -->
    <footer class="studio-footer-bar">
      <div class="footer-left">
        <span>RESOLUTION: <strong id="footerDimensions" style="color:#ffffff;">393 × 852 px</strong></span>
        <span id="footerAspectRatio" style="color:var(--studio-lime);">Aspect: 19.5:9</span>
        <span>BREAKPOINT: <span class="badge-tag mobile" id="footerBreakpoint">Mobile Standard (&lt;768px)</span></span>
      </div>
      <div class="footer-right">
        <span>ZOOM: <strong id="footerScale" style="color:#ffffff;">100%</strong></span>
        <span style="color:#64748b;">FARMS Multi-Platform Suite</span>
      </div>
    </footer>

  </div>

  <script src="js/dev-preview.js?v=1.0.4"></script>
</body>
</html>
