      align-items: center;
      justify-content: center;
      min-height: 100vh;

    .header-bar {

    }
    .header-bar p {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .top-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-tab {
      padding: 9px 18px;
      border-radius: 10px;
      border: 1.5px solid #059669;
      background: #064e3b;
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-tab.active {
      background: #10b981;
      color: #064e3b;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.45);
      border-color: #34d399;
    }

    .btn-tab.portal-link {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-color: #38bdf8;
      text-decoration: none;
    }
    .btn-tab.portal-link:hover {
      background: linear-gradient(135deg, #0369a1, #075985);
    }

    .map-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 1560px;
      min-height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #0f172a;
    }

    .map-card svg {
      width: 100%;
      height: auto;
      max-height: 72vh;
    }

    .room-group, .interactive-bldg {
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .room-group:hover .room-rect {
      fill: #d1fae5 !important;
      stroke: #059669 !important;
      stroke-width: 2.5px !important;
      filter: drop-shadow(0 6px 12px rgba(6, 78, 59, 0.2));

    .interactive-bldg:hover .bldg-shell {
      stroke-width: 3.5px !important;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.15));
