<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FARMS - Login</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Replaceable Background Image Container -->
  <div class="bg-image-container"></div>

  <!-- Code-Generated Curved Overlay Frame (No gaps, pickable colors) -->
  <div class="curved-frame-overlay">
    <svg viewBox="0 0 1440 600" preserveAspectRatio="none">
      <!-- Gold Accent Swoop -->
      <path class="swoop-gold-path" d="M0,220 C480,480 960,480 1440,220 L1440,601 L0,601 Z"></path>
      <!-- Primary Swoop -->
      <path class="swoop-green-path" d="M0,260 C480,510 960,510 1440,260 L1440,601 L0,601 Z"></path>
    </svg>
  </div>

  <!-- Centered Liquid Glass Login Card -->
  <div class="login-card">

    <div class="login-card-header">
      <h1 class="mini-logo">FARMS</h1>
      <hr class="header-divider">
      <h5 class="login-card-subtitle">Faculty Availability & Room Management System</h5>
    </div>

    <form action="#" method="POST">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div>
      <p class="footer-text">Need an account? <a href="#">Contact Admin</a></p>
    </div>
  </div>
</body>
</html>
